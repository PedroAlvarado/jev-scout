name: eval

# Runs the `claude plugin eval` suite (evals/*/case.yaml) on a clean Linux runner with
# Bash granted, so the skill's scanner and git history are exercised, several runs per
# case, and pinned models. Manual only: every run and every judge grader is a paid model
# call. Claude models are reached through OpenRouter when the OPENROUTER_API_KEY secret
# is set, otherwise directly with the ANTHROPIC_API_KEY secret.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case and arm; 1 keeps costs down, more give steadier scores
        default: "1"
      case:
        description: Case name glob; empty runs every case
        default: ""
      model:
        description: Model for the agent under test; empty picks Claude Opus 5.5 in the provider's naming
        default: ""
      judge_model:
        description: Model for the llm graders; empty picks Claude Haiku 4.5 in the provider's naming
        default: ""
      max_cost_usd:
        description: Hard cost ceiling for the whole run
        default: "20"
      threshold:
        description: Lowest acceptable case score, from 0 to 1
        default: "0.8"

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

env:
  # Pinned so a Claude Code release is never mistaken for a change in the skill.
  CLAUDE_CODE_VERSION: "2.1.280"

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check the model-provider secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            # Free call: confirms the key works and shows its credit limit before any paid run.
            key=$(curl -sS --fail -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/key) \
              || { echo "::error::OpenRouter rejected the OPENROUTER_API_KEY secret."; exit 1; }
            limit=$(echo "$key" | jq -r '(.data // .).limit // "none"')
            remaining=$(echo "$key" | jq -r '(.data // .).limit_remaining // "unlimited"')
            echo "OpenRouter key: credit limit $limit, remaining $remaining"
            echo "OpenRouter key credit limit: $limit, remaining: $remaining." >> "$GITHUB_STEP_SUMMARY"
            if [ "$limit" = "none" ]; then
              echo "::warning::This OpenRouter key has no credit limit. The eval's --max-cost-usd is a list-price estimate; set a limit on the key to cap real spend."
            fi
          elif [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add an OPENROUTER_API_KEY or ANTHROPIC_API_KEY repository secret before running evals (see evals/README.md)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up the sandbox that Bash-granting runs require
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          # Ubuntu 24.04 stops unprivileged user namespaces by default; bubblewrap needs them.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo systemctl reload apparmor
          fi
          # A Bash-granting eval refuses to start while the Docker credential folder holds
          # symbolic links. This runner has no Docker credentials, so move such a folder aside.
          if [ -d "$HOME/.docker" ] && [ -n "$(find "$HOME/.docker" -type l -print -quit)" ]; then
            mv "$HOME/.docker" "$RUNNER_TEMP/docker-config-moved"
          fi
          # Fail here, before any model call is paid for, if the sandbox cannot start.
          bwrap --ro-bind / / --dev /dev --unshare-user true
          echo "bubblewrap can create a sandbox"

      - name: Install Claude Code
        run: |
          npm install -g --allow-scripts=@anthropic-ai/claude-code "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Run the eval suite
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMPDIR: ${{ runner.temp }}/eval
          RUNS: ${{ inputs.runs }}
          CASE: ${{ inputs.case }}
          MODEL: ${{ inputs.model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            # OpenRouter's Anthropic-compatible endpoint: the key goes in ANTHROPIC_AUTH_TOKEN
            # (sent as a bearer token) and ANTHROPIC_API_KEY must be empty.
            export ANTHROPIC_BASE_URL="https://openrouter.ai/api"
            export ANTHROPIC_AUTH_TOKEN="$OPENROUTER_API_KEY"
            export ANTHROPIC_API_KEY=""
            MODEL="${MODEL:-anthropic/claude-opus-5.5}"
            JUDGE_MODEL="${JUDGE_MODEL:-anthropic/claude-haiku-4.5}"
            provider="OpenRouter"
          else
            MODEL="${MODEL:-claude-opus-5-5}"
            JUDGE_MODEL="${JUDGE_MODEL:-claude-haiku-4-5}"
            provider="Anthropic"
          fi
          unset OPENROUTER_API_KEY
          { echo "PROVIDER=$provider"; echo "RESOLVED_MODEL=$MODEL"; echo "RESOLVED_JUDGE_MODEL=$JUDGE_MODEL"; } >> "$GITHUB_ENV"
          mkdir -p "$TMPDIR" evals/results
          args=(
            .
            --scaffold
            --allow-tools Bash "WebFetch(domain:docs.typesafe.ai)" Write Edit
            --trust-plugin
            --no-publish
            --keep-temp
            --runs "$RUNS"
            -j 4
            --model "$MODEL"
            --judge-model "$JUDGE_MODEL"
            --max-cost-usd "$MAX_COST_USD"
            --threshold "$THRESHOLD"
            --json evals/results/ci.json
            --report evals/results/ci.html
          )
          if [ -n "$CASE" ]; then args+=(--case "$CASE"); fi
          claude plugin eval "${args[@]}"

      - name: Summarize
        if: always()
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          if [ -f evals/results/ci.json ]; then
            # The summary goes to the job page and to this log, so `gh run view --log` shows it too.
            {
              echo "## Jev Scout eval"
              echo
              echo "Provider $PROVIDER, agent model \`$RESOLVED_MODEL\`, judge \`$RESOLVED_JUDGE_MODEL\`, $RUNS runs per case and arm, Claude Code $CLAUDE_CODE_VERSION."
              echo
              node evals/summarize.mjs evals/results/ci.json
            } | tee -a "$GITHUB_STEP_SUMMARY"
            # Only each run's transcript: the rest of a kept run holds sealed folders that no one can read.
            node evals/collect-traces.mjs evals/results/ci.json evals/results/traces
          else
            echo "No results were written; see the Run the eval suite step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results-${{ github.run_id }}
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 30
